description: 417,146 graded UK used-car listings across 78 makes, each scored on modelled true monthly cost of ownership (depreciation + finance + running costs) with published error ranges (RMSLE 0.161, MAE ~1,770 GBP). Aggregate counts, per-make volumes and the full scoring methodology are queryable as unauthenticated JSON at trothstone.com/api/stats, /api/makes, /api/models, /api/search and /api/value; per-listing records stay on the source adverts, so the site links out rather than redistributing them. Not financial advice; UK market only.
